<section class="w-full flex items-center  hero-section min-h-[80vh] py-12">
  <div class="container mx-auto w-full text-black px-4 md:px-6">

    <div class="flex flex-col lg:flex-row items-center lg:items-start justify-between gap-10">
      <div class="w-full lg:w-[55%] text-center lg:text-left">
        <h1 class="mb-6 hero-heading text-4xl md:text-5xl lg:text-6xl font-bold leading-tight">
          Travel Memories You'll Never <span class="hero-heading-part text-(--primary-color)">Forget</span>
        </h1>
        <p class="text-lg md:text-xl mb-8 text-gray-600 max-w-2xl mx-auto lg:mx-0">
          From local escapes to far-flung adventures, find what makes you happy anytime, anywhere.
        </p>
      </div>
      <div class="w-full lg:w-[40%] hidden lg:block"></div>
    </div>

    <div class="mt-10 lg:mt-20 w-full lg:w-[90%] xl:w-[85%] bg-white p-2 lg:p-3 rounded-3xl lg:rounded-full shadow-2xl ms-0 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-2 lg:gap-0 border border-gray-100">

      <div class="flex-1 lg:border-r border-gray-100">
        <app-custom-dropdown
          label="Where"
          placeholder="Search destinations"
          icon="ri-map-pin-line"
          [options]="['Phuket', 'Bangkok', 'Bali', 'Tokyo', 'Paris']"
          (valueChange)="searchForm.location = $event">
        </app-custom-dropdown>
      </div>

      <div class="flex-1 lg:border-r border-gray-100 relative group">
        <div class="w-full px-5 py-3 flex items-center gap-4 cursor-pointer hover:bg-gray-50 rounded-full  transition-colors">
          <div class="w-10 h-10 shrink-0 bg-orange-50 rounded-full flex items-center justify-center text-(--primary-color)">
            <i class="ri-calendar-line text-xl"></i>
          </div>
          <div class="text-left">
            <h3 class="font-bold text-[10px] text-gray-400 uppercase tracking-widest">When</h3>
            <p class="text-sm font-black text-gray-900">{{ searchForm.date || 'Select Date' }}</p>
          </div>
        </div>

        <div class="absolute hidden group-hover:block z-50 mt-2 left-0 lg:left-1/2 lg:-translate-x-1/2 shadow-2xl">
          <app-custom-calendar (dateSelected)="searchForm.date = $event.toISOString().split('T')[0]"></app-custom-calendar>
        </div>
      </div>

      <div class="flex-1">
        <app-custom-dropdown
          label="Tour Type"
          placeholder="All tours"
          icon="ri-compass-3-line"
          [options]="['Nature Tours', 'Adventure Tours', 'Cultural Tours', 'Food Tours', 'City Tours']"
          (valueChange)="searchForm.type = $event">
        </app-custom-dropdown>
      </div>

      <div class="px-2 pb-2 lg:pb-0 lg:pr-2">
        <button (click)="onSearch()"
          class="w-full lg:w-16 h-14 lg:h-16 rounded-2xl lg:rounded-full bg-(--primary-color) flex items-center justify-center text-white shadow-lg hover:brightness-110 transition-all cursor-pointer">
          <i class="ri-search-line text-2xl"></i>
          <span class="lg:hidden ml-2 font-bold text-lg">Search Now</span>
        </button>
      </div>

    </div>
  </div>
</section>
