<section class="mt-20 feature-trip-section">
  <div class="container py-20">
    <div class="flex items-center justify-between mb-10">
      <h1 class="font-bold text-3xl text-(--text-dark)">Travel Articles</h1>
      <a routerLink="/articles" class="text-orange-600 font-bold hover:underline">See All</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
      @for (item of features; track item.id) {
      <div
        [routerLink]="['/articles', item.id]"
        class="feature-trip-box group w-full overflow-hidden rounded-2xl cursor-pointer flex items-center justify-center flex-col p-3 transition-all hover:shadow-xl bg-white border border-transparent hover:border-gray-100">

        <div class="feature-icon w-full bg-[#FEF7F4] flex items-center justify-center relative overflow-hidden rounded-xl">
          <img
            [src]="'/images/' + item.image"
            [alt]="item.alt"
            class="w-full transition-transform duration-500 group-hover:scale-110" />

          <div class="absolute top-4 left-4">
            <span class="bg-white/90 backdrop-blur px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-widest">
              {{ item.badge }}
            </span>
          </div>
        </div>

        <div class="text-start mt-4 px-2 w-full">
          <div class="flex gap-4 items-center mb-2">
            <p class="text-gray-400 text-xs font-medium flex items-center gap-1">
              <i class="ri-calendar-line"></i> {{ item.date }}
            </p>
            <p class="text-gray-400 text-xs font-medium flex items-center gap-1">
              <i class="ri-user-line"></i> {{ item.author }}
            </p>
          </div>

          <h4 class="text-gray-900 text-lg font-bold tracking-tight group-hover:text-orange-600 transition-colors line-clamp-2 h-14">
            {{ item.title }}
          </h4>

          <div class="mt-4 flex items-center text-orange-600 font-bold text-sm opacity-0 group-hover:opacity-100 transition-opacity">
            Read Article <i class="ri-arrow-right-line ml-2"></i>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</section>
