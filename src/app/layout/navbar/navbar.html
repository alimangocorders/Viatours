<div class="bg-[#FEF7F4] px-4 md:px-8 py-6 sticky top-0 z-50">
  <nav class="container mx-auto flex items-center justify-between gap-4">

    <div class="shrink-0">
      <a routerLink="/"> <img src="images/logo.png" alt="Viatours Logo" class="h-8 md:h-10"></a>
    </div>

    <div class="hidden lg:flex flex-1 max-w-md mx-8">
      <div class="relative w-full">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
          <i class="ri-search-line"></i>
        </span>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (keyup.enter)="onSearchEnter()"
          placeholder="Search destinations..."
          class="w-full py-2 pl-10 pr-4 bg-gray-100 border-none rounded-full text-sm focus:ring-2 focus:ring-(--primary-color) outline-none transition-all"
        >
      </div>
    </div>

    <div class="flex items-center gap-2 md:gap-6">
      <ul class="hidden xl:flex items-center gap-8 text-sm font-medium text-(--text-dark)">
        <li><a routerLink="/" routerLinkActive="text-(--primary-color)" [routerLinkActiveOptions]="{exact: true}" class="hover:text-(--primary-color) transition-colors">Home</a></li>
        <li><a routerLink="/destinations" routerLinkActive="text-(--primary-color)" class="hover:text-(--primary-color) transition-colors">Destinations</a></li>
        <li><a routerLink="/tour" routerLinkActive="text-(--primary-color)" class="hover:text-(--primary-color) transition-colors">Tours</a></li>
      </ul>

      <div class="flex items-center gap-3">
        <a routerLink="/signup"><button class="hidden sm:block text-sm font-medium text-(--text-dark) px-4 cursor-pointer"> Sign Up </button></a>
        <a routerLink="/login">
          <button class="btn-primary px-6 py-2.5 rounded-full text-sm font-bold text-white shadow-md hover:shadow-lg transition-all hidden sm:block cursor-pointer">
            Log In
          </button>
        </a>

        <button (click)="isMenuOpen = !isMenuOpen" class="xl:hidden text-2xl p-1 cursor-pointer">
          <i [class]="isMenuOpen ? 'ri-close-line' : 'ri-menu-fill'"></i>
        </button>
      </div>
    </div>
  </nav>

  @if (isMenuOpen) {
    <div class="xl:hidden bg-white border-t border-gray-100 absolute left-0 w-full p-6 shadow-xl animate-in fade-in slide-in-from-top-4">
      <div class="relative w-full mb-6 lg:hidden">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (keyup.enter)="onSearchEnter()"
          placeholder="Search destinations..."
          class="w-full py-3 pl-10 pr-4 bg-gray-50 border border-gray-100 rounded-xl text-sm outline-none"
        >
        <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      </div>

      <ul class="flex flex-col gap-4 text-lg font-medium">
        <li><a routerLink="/" (click)="isMenuOpen = false" class="block py-2">Home</a></li>
        <li><a routerLink="/destinations" (click)="isMenuOpen = false" class="block py-2">Destinations</a></li>
        <li><a routerLink="/tour" (click)="isMenuOpen = false" class="block py-2">Tours</a></li>
        <li><a routerLink="/contact" (click)="isMenuOpen = false" class="block py-2">Contact</a></li>

        <hr class="border-gray-50 my-2">

        <div class="flex flex-col gap-3 sm:hidden">
          <a routerLink="/signup" (click)="isMenuOpen = false" class="w-full py-3 text-center text-sm font-semibold text-(--text-dark)">Sign Up</a>
          <a routerLink="/login" (click)="isMenuOpen = false" class="w-full">
            <button class="w-full btn-primary px-6 py-3 rounded-full text-sm font-bold text-white shadow-md">
              Log In
            </button>
          </a>
        </div>
      </ul>
    </div>
  }
</div>
